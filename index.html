<title>NCCS School Manager</title>
<style>

@media(prefers-color-scheme:dark){:root{--bg:#0e1020;--card:#171a30;--tx:#eceef8;--mu:#9aa0bd;--bd:#262a47;--ac:#9db0ff;--soft:rgba(157,176,255,.14);--ee:#3ecf86;--me:#6ea8ff;--ae:#f5a524;--be:#ff7b6b}:root[data-band=pri]{--bg:#171119;--card:#221a24;--bd:#372a3a;--ac:#ff7ac6;--soft:rgba(255,122,198,.14)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg)}
body{color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:0 12px 100px;max-width:760px;margin:auto}
.hd{background:linear-gradient(135deg,var(--g1),var(--g2));border-bottom:4px solid var(--pop);color:#fff;margin:0 -12px 14px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 18px;border-radius:0 0 24px 24px;box-shadow:0 4px 14px rgba(0,0,0,.18)}

.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
select,input,textarea,.btn{width:100%;padding:12px;margin:5px 0;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
.btn{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border:0;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}.btn.s{width:auto;padding:9px 14px}.row{display:flex;gap:8px}.row>*{flex:1}
.lr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}.lr:last-child{border:0}.lr span{flex:1;min-width:0}.lr input,.lr select{width:100px;margin:0;text-align:center}

.sc{overflow-x:auto;padding:6px}table{border-collapse:collapse;width:100%;font-size:13px}th{color:var(--mu);font-weight:600;font-size:12px}th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}td:nth-child(2),th:nth-child(2){text-align:left}
tr.cl{cursor:pointer}tr.cl:active{background:var(--bg)}.EE{color:var(--ee)}.ME{color:var(--me)}.AE{color:var(--ae)}.BE{color:var(--be)}
.big{font-size:36px;font-weight:800;line-height:1.1}.chip{text-align:center;padding:10px 4px;border-radius:12px;background:var(--bg)}.chip b{display:block;font-size:22px}
.bar{height:6px;background:var(--bd);border-radius:6px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:6px}
.x{background:none;border:0;color:var(--be);font-size:20px;padding:4px 8px}.lk{background:none;border:0;color:var(--ac);font:inherit;text-decoration:underline;padding:0}
#rc{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:16px;display:none;z-index:9}#rc.on{display:block}
#rc .pg{max-width:640px;margin:auto}#rc table td:nth-child(2),#rc table th:nth-child(2){text-align:center}#rc table td:first-child,#rc table th:first-child{text-align:left}
@media print{body>*:not(#rc){display:none!important}#rc{position:static;display:block!important}.np{display:none!important}}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}

.stat{display:flex;gap:8px}.stat>div{flex:1;background:var(--soft);border-radius:14px;padding:10px;text-align:center}.stat.card{background:var(--card)}.stat b{display:block;font-size:17px;color:var(--ac)}
#rc h4{margin:16px 0 6px}
.rh{background:linear-gradient(135deg,var(--g1),var(--g2));border-bottom:4px solid var(--pop);color:#fff;border-radius:16px;padding:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}.rh small{color:rgba(255,255,255,.85)}
@media print{:root,:root[data-band]{--bg:#fff;--card:#fff;--tx:#16192b;--mu:#69708a;--bd:#ddd}#rc{background:#fff;color:#16192b}}
.gc{flex:0 0 66px;text-align:center;font-size:13px;font-weight:700}.mi{width:76px!important}
.bc{padding-bottom:24px;margin-bottom:24px;border-bottom:2px dashed var(--bd)}
@media print{body{padding:0!important}.bc{break-after:page;page-break-after:always;border:0;margin:0;padding:0;break-inside:avoid}.bc:last-child{break-after:auto;page-break-after:auto}#rc{padding:8px}#rc .pg{font-size:12px}#rc .card{padding:8px;margin-bottom:6px}#rc table{font-size:11px}#rc th,#rc td{padding:4px}#rc h4{margin:8px 0 4px!important}}
.gpr{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}.gp{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--mu);font-weight:700}.gp.on{background:var(--g1);color:#fff;border-color:var(--g1)}
</style></head><body>
<div class="hd"><div class="row"><img src="icon-192.png" width="44" height="44" alt="" style="flex:0 0 44px;border-radius:12px"><div><h1>Njoro Central Comprehensive School</h1><small id="who">Marks, fees &amp; report cards</small></div><button class="lk" id="so" style="display:none;flex:0 0 auto" onclick="auth.signOut()">Sign out</button></div></div>
<nav id="nav"></nav><div id="v"><p class="mu">Loading…</p></div><div id="rc"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* PASTE YOUR FIREBASE CONFIG HERE (Project settings > Your apps > Web app) */
const firebaseConfig={apiKey:"AIzaSyAaYCJqtxEKWELfcoN8KCBq9aFI2ob1-IA",authDomain:"njoro-central-comprehensive.firebaseapp.com",projectId:"njoro-central-comprehensive",storageBucket:"njoro-central-comprehensive.firebasestorage.app",messagingSenderId:"933888355379",appId:"1:933888355379:web:d04fc48feacd799fcf0746"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const GR=[1,2,3,4,5,6,7,8,9].map(n=>"Grade "+n);
const LOW=["English Activities","Kiswahili Activities","Mathematical Activities","Environmental Activities","Religious Activities","Creative Activities"];
const UP=["English","Kiswahili","Mathematics","Science & Technology","Social Studies","Agriculture & Nutrition","CRE","Creative Arts"];
const JS=["English","Kiswahili","Mathematics","Integrated Science","Social Studies","Pre-Technical Studies","Agriculture & Nutrition","Creative Arts & Sports","CRE"];
const subs=g=>{const n=+g.split(" ")[1];return n<=3?LOW:n<=6?UP:JS};
const BANDS=[[90,"EE1",8],[75,"EE2",7],[58,"ME1",6],[41,"ME2",5],[31,"AE1",4],[21,"AE2",3],[11,"BE1",2],[0,"BE2",1]];
const isJS=g=>true;
const gb=x=>BANDS.find(b=>x>=b[0])||BANDS[7];
const gtxt=x=>gb(x)[1]+" · "+gb(x)[2];
const lvl=p=>isJS(sel.grade)?(p>=75?"EE":p>=41?"ME":p>=21?"AE":"BE"):(p>=75?"EE":p>=50?"ME":p>=25?"AE":"BE");
const CM={EE:"Exceeds expectations. Excellent work, keep it up.",ME:"Meets expectations. Good effort; aim higher next term.",AE:"Approaching expectations. More practice and revision are needed.",BE:"Below expectations. Needs close support and extra help."};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug=s=>s.replace(/[^A-Za-z0-9]+/g,"-");
const opt=(a,s)=>a.map(x=>`<option ${x==s?"selected":""}>${x}</option>`).join("");
const td=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const money=n=>"KES "+Math.round(n).toLocaleString();let fr=null;
const lockBox=()=>D.act?.exam?`<div class="chip" style="margin:6px 0"><small>🔒 Exam · set by admin</small><b style="font-size:16px">${esc(D.act.exam)}</b></div>`:`<div class="chip" style="margin:6px 0"><b class="BE" style="font-size:14px">The admin has not set the exam yet.</b><small>Ask the admin to choose the exam, then reopen this tab.</small></div>`;
const actCard=()=>`<div class="card"><small>🔒 Teachers can enter marks only for:</small><b style="display:block;font-size:16px;margin:2px 0 6px">${D.act?.exam?esc(D.act.exam):"— not set yet —"}</b>${D.act?.exam==sel.exam?`<small class="EE">✓ This is the active exam</small>`:`<button class="btn" onclick="setActive()">Make "${esc(sel.exam)}" active for teachers</button>`}</div>`;
function setActive(){if(!admin)return;const ex=sel.exam;ask("Make "+ex+" the exam teachers enter marks for? Teachers cannot change it, only you can.","Make active",async()=>{await db.doc("settings/exam").set({exam:ex});D.act={exam:ex};render();toast("Active exam set")})}
function moveExam(all){if(!admin)return;const et=$("mvet").value,ey=$("mvey").value,to=et+" "+ey;if(to==sel.exam)return toast("Choose a different exam");
const src=Object.keys(D.marks).filter(k=>{const m=D.marks[k];return m.grade==sel.grade&&m.exam==sel.exam&&(all||m.subject==sel.sub)&&Object.keys(m.scores||{}).length});
if(!src.length)return toast("No marks to move");
const mv=src.map(k=>({k,m:D.marks[k],nk:slug(to)+"__"+slug(sel.grade)+"__"+slug(D.marks[k].subject)}));const clash=mv.filter(x=>Object.keys(D.marks[x.nk]?.scores||{}).length).length;
ask("Move "+(all?src.length+" subject(s)":sel.sub)+" marks for "+sel.grade+" from "+sel.exam+" to "+to+"?"+(clash?" "+clash+" subject(s) in "+to+" already have marks and will be replaced.":""),"Move",async()=>{
const b=db.batch();mv.forEach(x=>{clearTimeout(timers[x.k]);delete timers[x.k];clearTimeout(timers[x.nk]);delete timers[x.nk];b.set(db.doc("marks/"+x.nk),{exam:to,grade:x.m.grade,subject:x.m.subject,created:D.marks[x.nk]?.created||x.m.created||Date.now(),scores:{...x.m.scores}});b.delete(db.doc("marks/"+x.k))});
await b.commit();mv.forEach(x=>{D.marks[x.nk]={...x.m,exam:to,created:D.marks[x.nk]?.created||x.m.created};delete D.marks[x.k]});sel.exam=to;sel.et=et;sel.ey=ey;render();toast("Marks moved to "+to)})}
function copyMarks(move){if(!admin)return;const to=$("cpto").value;if(!to||to==sel.sub)return toast("Choose another subject");
const pre=slug(sel.exam)+"__"+slug(sel.grade)+"__",ks=pre+slug(sel.sub),kt=pre+slug(to),src=D.marks[ks]?.scores||{};
if(!Object.keys(src).length)return toast("No marks here to copy");const has=Object.keys(D.marks[kt]?.scores||{}).length>0;
ask((move?"Move ":"Copy ")+sel.sub+" marks to "+to+" ("+sel.grade+", "+sel.exam+")?"+(has?" "+to+" already has marks, which will be replaced.":""),move?"Move":"Copy",async()=>{
clearTimeout(timers[kt]);delete timers[kt];if(move){clearTimeout(timers[ks]);delete timers[ks]}
const data={exam:sel.exam,grade:sel.grade,subject:to,created:D.marks[kt]?.created||Date.now(),scores:{...src}};
D.marks[kt]=data;await db.doc("marks/"+kt).set(data);if(move){delete D.marks[ks];await db.doc("marks/"+ks).delete()}
sel.sub=to;render();toast(move?"Moved":"Copied")})}
function resetSub(){if(!admin)return;const k=slug(sel.exam)+"__"+slug(sel.grade)+"__"+slug(sel.sub);if(!D.marks[k]||!Object.keys(D.marks[k].scores||{}).length)return toast("No marks to clear");
ask("Clear all "+sel.sub+" marks for "+sel.grade+", "+sel.exam+"? This cannot be undone.","Clear marks",async()=>{clearTimeout(timers[k]);delete timers[k];delete D.marks[k];await db.doc("marks/"+k).delete();render();toast("Cleared")})}
function resetExam(){if(!admin)return;const ks=Object.keys(D.marks).filter(k=>D.marks[k].grade==sel.grade&&D.marks[k].exam==sel.exam);if(!ks.length)return toast("No marks to clear");
ask("Clear ALL subjects' marks for "+sel.grade+", "+sel.exam+"? This cannot be undone.","Clear all",async()=>{const b=db.batch();ks.forEach(k=>{clearTimeout(timers[k]);delete timers[k];b.delete(db.doc("marks/"+k));delete D.marks[k]});await b.commit();render();toast("Cleared")})}
function editL(id){const l=D.learners.find(x=>x.id==id);if(!l)return;const m=document.createElement("div");m.id="md";
m.innerHTML=`<div class="bx"><p style="margin:0 0 8px;font-size:16px"><b>Edit learner</b></p><small>Name</small><input id="en" value="${esc(l.name)}"><small>ADM number (optional)</small><input id="ea" value="${esc(l.adm||"")}"><small>Marks, fees and results stay linked to this learner.</small><div class="row" style="margin-top:10px"><button class="btn" style="background:var(--mu)" id="mn">Cancel</button><button class="btn" id="my">Save</button></div></div>`;
document.body.appendChild(m);m.querySelector("#mn").onclick=()=>m.remove();
m.querySelector("#my").onclick=async()=>{const n=m.querySelector("#en").value.trim();if(!n)return toast("Name can't be empty");await db.doc("learners/"+id).update({name:n,adm:m.querySelector("#ea").value.trim()});m.remove();toast("Saved")}}
function ask(msg,label,fn){const m=document.createElement("div");m.id="md";m.innerHTML=`<div class="bx"><p style="margin:0 0 16px;font-size:16px">${esc(msg)}</p><div class="row"><button class="btn" style="background:var(--mu)" id="mn">Cancel</button><button class="btn" id="my">${esc(label)}</button></div></div>`;document.body.appendChild(m);m.querySelector("#mn").onclick=()=>m.remove();m.querySelector("#my").onclick=()=>{m.remove();fn()}}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
let me=null,role=null,admin=false,tab="Learners",unsubs=[],myCl=[];
let D={learners:[],marks:{},pay:[],fees:{},users:[]},sel={grade:GR[0],et:"Opener Term 3",ey:String(new Date().getFullYear()),exam:"Opener Term 3 "+new Date().getFullYear(),sub:null,year:String(new Date().getFullYear()),pdate:td()},timers={};
const $=id=>document.getElementById(id);
function nav(){const T=me&&(role=="teacher"||admin)?["Learners","Marks","Results"].concat(admin?["Fees","Users"]:[]):[];const IC={Learners:"👥",Marks:"✏️",Results:"📊",Fees:"💰",Users:"🔑"};$("nav").innerHTML=T.map(t=>`<button class="${t==tab?"on":""}" onclick="tab='${t}';render();scrollTo(0,0)"><span>${IC[t]}</span>${t}</button>`).join("")}
const gp=()=>`<select onchange="sel.grade=this.value;sel.sub=null;render()">${opt(GR,sel.grade)}</select>`;
const EXT=["Opener Term 1","Opener Term 2","Opener Term 3","Midterm Term 1","Midterm Term 2","Midterm Term 3","Endterm Term 1","Endterm Term 2","Endterm Term 3","KNEC SBA Term 3"];
const YRS=()=>{const y=new Date().getFullYear();return[y+1,y,y-1,y-2].map(String)};
const stdEx=e=>EXT.some(t=>e.startsWith(t+" ")&&/^\d{4}$/.test(e.slice(t.length+1)));
const exm=()=>{const old=[...new Set(Object.values(D.marks).map(m=>m.exam).filter(e=>e&&!stdEx(e)))];
return `<div class="row"><select onchange="sel.et=this.value;sel.exam=sel.et+' '+sel.ey;render()">${opt(EXT,sel.et)}</select><select style="flex:0 0 92px" onchange="sel.ey=this.value;sel.exam=sel.et+' '+sel.ey;render()">${opt(YRS(),sel.ey)}</select></div>${old.length?`<select onchange="if(this.value){sel.exam=this.value;render()}"><option value="">Older exams…</option>${old.map(e=>`<option ${e==sel.exam?"selected":""}>${esc(e)}</option>`).join("")}</select>`:""}<small>Exam: <b>${esc(sel.exam)}</b></small>`};
const LL=()=>D.learners.filter(l=>l.grade==sel.grade).sort((a,b)=>a.name.localeCompare(b.name));
const mk=(g,e,s)=>D.marks[slug(e)+"__"+slug(g)+"__"+slug(s)]?.scores||{};
function loginView(){$("v").innerHTML=`<div class="card" style="text-align:center;padding:22px 16px"><img src="icon-192.png" width="72" height="72" alt="" style="border-radius:18px"><h2 style="margin:10px 0 2px">Welcome</h2><small>Sign in to enter marks and view results</small></div><div class="card"><b>Staff sign in</b><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (min 6 characters)"><div class="row"><button class="btn" onclick="login()">Sign in</button><button class="btn" style="background:var(--mu)" onclick="reg()">Register</button></div><small id="err" class="BE"></small><p><small>New teachers: register, then ask the admin to approve your account.</small></p></div>`}
const er=e=>{$("err").textContent=e.message.replace("Firebase: ","")};
function login(){auth.signInWithEmailAndPassword($("em").value.trim(),$("pw").value).catch(er)}
function reg(){auth.createUserWithEmailAndPassword($("em").value.trim(),$("pw").value).then(c=>db.doc("users/"+c.user.uid).set({email:c.user.email,role:"pending"})).catch(er)}
function render(){document.documentElement.dataset.band=me&&(role=="teacher"||admin)&&+sel.grade.split(" ")[1]<=6?"pri":"js";nav();if(!me)return loginView();const v=$("v");
if(role!="teacher"&&!admin){v.innerHTML='<div class="card"><b>Waiting for approval</b><p class="mu">Your account is registered. Ask the school admin to approve it, then reopen the app.</p></div>';return}
const L=LL(),S=subs(sel.grade);sel.sub=S.includes(sel.sub)?sel.sub:S[0];
if(tab=="Learners")v.innerHTML=`<div class="card">${gp()}${(admin||myCl.includes(sel.grade))?`<textarea id="bulk" rows="4" placeholder="Paste names, one per line. Optional: ADM no, Name"></textarea><button class="btn" onclick="addL()">Add learners to ${sel.grade}</button>`:`<small>${myCl.length?"You can add learners only to: "+myCl.join(", ")+".":"Ask the admin to assign you a class so you can add learners."}</small>`}</div>

const total=P.reduce((a,x)=>a+x.amount,0),byDay={},byG={};P.forEach(x=>{byDay[x.date]=(byDay[x.date]||0)+x.amount;const g=payInfo(x).grade;byG[g]=(byG[g]||0)+x.amount});

const bal=D.learners.filter(l=>GR.includes(l.grade)&&(fr.grade=="All"||l.grade==fr.grade)&&D.fees[l.grade]).map(l=>{const p=D.pay.filter(x=>x.lid==l.id&&(x.year||sel.year)==sel.year).reduce((a,x)=>a+x.amount,0);return{l,p,b:D.fees[l.grade]-p}}).filter(r=>r.b>0).sort((a,b)=>b.b-a.b);
const ob=bal.reduce((a,r)=>a+r.b,0);
$("rc").innerHTML=`<div class="pg"><div style="text-align:center"><h2 style="margin:0">Njoro Central Comprehensive School</h2><b>FEE COLLECTION REPORT</b><br><small>${esc(fr.from)} to ${esc(fr.to)} · ${esc(fr.grade)}</small></div>
<div class="row np" style="margin-top:10px"><div><small>From</small><input type="date" value="${fr.from}" onchange="fr.from=this.value;frep()"></div><div><small>To</small><input type="date" value="${fr.to}" onchange="fr.to=this.value;frep()"></div></div><div class="np"><small>Grade</small><select onchange="fr.grade=this.value;frep()">${opt(["All",...GR],fr.grade)}</select></div>
<div class="stat" style="margin:12px 0"><div><small>Collected</small><b>${money(total)}</b></div><div><small>Payments</small><b>${P.length}</b></div><div><small>Learners paid</small><b>${payers}</b></div></div>
<h4>By day</h4><table><tr><th>Date</th><th>Amount</th></tr>${Object.keys(byDay).sort().map(d=>`<tr><td>${esc(d)}</td><td>${byDay[d].toLocaleString()}</td></tr>`).join("")||'<tr><td colspan="2">No payments</td></tr>'}</table>
${fr.grade=="All"?`<h4>By grade</h4><table><tr><th>Grade</th><th>Amount</th></tr>${GR.filter(g=>byG[g]).map(g=>`<tr><td>${g}</td><td>${byG[g].toLocaleString()}</td></tr>`).join("")}</table>`:""}
<h4>Payments</h4><table><tr><th>Date</th><th>Learner</th><th>Amount</th></tr>${P.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(payInfo(x).name)}</td><td>${x.amount.toLocaleString()}</td></tr>`).join("")||'<tr><td colspan="3">None</td></tr>'}</table>
<h4>Outstanding balances ${esc(sel.year)} · ${money(ob)}</h4><table><tr><th>Learner</th><th>Grade</th><th>Paid</th><th>Balance</th></tr>${bal.map(r=>`<tr><td>${esc(r.l.name)}</td><td>${r.l.grade}</td><td>${r.p.toLocaleString()}</td><td><b class="BE">${r.b.toLocaleString()}</b></td></tr>`).join("")||'<tr><td colspan="4">None</td></tr>'}</table>
<div class="row np" style="margin-top:14px"><button class="btn" onclick="window.print()">Print / Save PDF</button><button class="btn" onclick="fcsv()">Download CSV</button><button class="btn" style="background:var(--mu)" onclick="$('rc').classList.remove('on')">Close</button></div></div>`;$("rc").classList.add("on")}
function fcsv(){const rows=[["Date","Learner","Grade","Amount"],...(window.lastP||[]).map(x=>{const i=payInfo(x);return[x.date,i.name,i.grade,x.amount]})];const b=new Blob([rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`fees-${fr.from}-to-${fr.to}.csv`;a.click()}
async function setFee(v){await db.doc("settings/fees").set({...D.fees,[sel.grade]:+v||0})}
const typing=()=>{const a=document.activeElement;return a&&a.tagName=="INPUT"&&a.closest(".lr")};
const again=()=>{if(!typing())render()};
function stop(){unsubs.forEach(f=>f());unsubs=[]}
function start(){stop();const sn=(q,f)=>unsubs.push(q.onSnapshot(f,e=>console.log(e)));
sn(db.collection("learners"),s=>{D.learners=s.docs.map(d=>({id:d.id,...d.data()}));again()});
sn(db.collection("marks"),s=>{const ids=new Set(s.docs.map(d=>d.id));Object.keys(D.marks).forEach(k=>{if(!ids.has(k)&&!timers[k])delete D.marks[k]});s.docs.forEach(d=>{if(!timers[d.id])D.marks[d.id]=d.data()});again()});
sn(db.doc("settings/fees"),s=>{D.fees=s.data()||{};again()});
sn(db.doc("settings/exam"),s=>{D.act=s.data()||null;again()});
if(admin){sn(db.collection("payments"),s=>{D.pay=s.docs.map(d=>({id:d.id,...d.data()}));again()});sn(db.collection("users"),s=>{D.users=s.docs.map(d=>({id:d.id,...d.data()}));again()})}}
let uu=()=>{};
auth.onAuthStateChanged(u=>{uu();stop();me=u;role=null;admin=false;$("so").style.display=u?"":"none";if(!u)return render();
uu=db.doc("users/"+u.uid).onSnapshot(s=>{const r=s.data()?.role||"pending";myCl=s.data()?.classes||[];if(r!="admin"&&myCl.length&&!myCl.includes(sel.grade)&&!sel.cl0){sel.grade=myCl[0];sel.cl0=1}if(r!=role){role=r;admin=r=="admin";stop();if(role=="teacher"||admin)start()}render()},e=>console.log(e))});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
