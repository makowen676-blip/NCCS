<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b3a"><link rel="manifest" href="manifest.json">
<title>NCCS School Manager</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--ac:#0b6b3a;--bd:#e2e5ea;--ee:#0b6b3a;--me:#2563eb;--ae:#d97706;--be:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2026;--tx:#eceff3;--mu:#98a2b3;--ac:#3ecf86;--bd:#2c333b;--ee:#3ecf86;--me:#6ea8ff;--ae:#f5a524;--be:#ff7b6b}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg)}body{color:var(--tx);font:15px system-ui,sans-serif;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));max-width:760px;margin:auto}
h1{font-size:18px;margin:0 0 2px}small,.mu{color:var(--mu)}
nav{display:flex;gap:6px;margin:10px 0}nav button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font-weight:600}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
select,input,textarea,.btn{width:100%;padding:10px;margin:4px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btn{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}.btn.s{width:auto;padding:8px 12px}.row{display:flex;gap:8px}.row>*{flex:1}
.lr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}.lr span{flex:1}.lr input,.lr select{width:100px;margin:0;text-align:center}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}td:nth-child(2),th:nth-child(2){text-align:left}
tr.cl{cursor:pointer}.EE{color:var(--ee)}.ME{color:var(--me)}.AE{color:var(--ae)}.BE{color:var(--be)}
.x{background:none;border:0;color:var(--be);font-size:18px}.lk{background:none;border:0;color:var(--ac);font:inherit;text-decoration:underline;padding:0}
#rc{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:16px;display:none;z-index:9}#rc.on{display:block}
#rc .pg{max-width:640px;margin:auto}#rc table td:nth-child(2),#rc table th:nth-child(2){text-align:center}#rc table td:first-child,#rc table th:first-child{text-align:left}
@media print{body>*:not(#rc){display:none!important}#rc{position:static;display:block!important}.np{display:none!important}}
</style></head><body>
<div class="row" style="align-items:center"><div><h1>Njoro Central Comprehensive School</h1><small id="who">Marks, fees &amp; report cards</small></div><button class="lk" id="so" style="display:none;flex:0 0 auto" onclick="auth.signOut()">Sign out</button></div>
<nav id="nav"></nav><div id="v"><p class="mu">Loading…</p></div><div id="rc"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* PASTE YOUR FIREBASE CONFIG HERE (Project settings > Your apps > Web app) */
const firebaseConfig={apiKey:"AIzaSyAaYCJqtxEKWELfcoN8KCBq9aFI2ob1-IA",authDomain:"njoro-central-comprehensive.firebaseapp.com",projectId:"njoro-central-comprehensive",storageBucket:"njoro-central-comprehensive.firebasestorage.app",messagingSenderId:"933888355379",appId:"1:933888355379:web:d04fc48feacd799fcf0746"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const GR=[1,2,3,4,5,6,7,8,9].map(n=>"Grade "+n);
const LOW=["English Activities","Kiswahili Activities","Mathematical Activities","Environmental Activities","Religious Activities","Creative Activities"];
const UP=["English","Kiswahili","Mathematics","Science & Technology","Social Studies","Agriculture & Nutrition","CRE","Creative Arts"];
const JS=["English","Kiswahili","Mathematics","Integrated Science","Social Studies","Pre-Technical Studies","Agriculture & Nutrition","Creative Arts & Sports","CRE"];
const subs=g=>{const n=+g.split(" ")[1];return n<=3?LOW:n<=6?UP:JS};
const lvl=p=>p>=75?"EE":p>=50?"ME":p>=25?"AE":"BE";
const CM={EE:"Exceeds expectations. Excellent work, keep it up.",ME:"Meets expectations. Good effort; aim higher next term.",AE:"Approaching expectations. More practice and revision are needed.",BE:"Below expectations. Needs close support and extra help."};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug=s=>s.replace(/[^A-Za-z0-9]+/g,"-");
const opt=(a,s)=>a.map(x=>`<option ${x==s?"selected":""}>${x}</option>`).join("");
let me=null,role=null,admin=false,tab="Learners",unsubs=[];
let D={learners:[],marks:{},pay:[],fees:{},users:[]},sel={grade:GR[0],exam:"Opener Term 3",sub:null},timers={};
const $=id=>document.getElementById(id);
function nav(){const T=me&&(role=="teacher"||admin)?["Learners","Marks","Results"].concat(admin?["Fees","Users"]:[]):[];$("nav").innerHTML=T.map(t=>`<button class="${t==tab?"on":""}" onclick="tab='${t}';render()">${t}</button>`).join("")}
const gp=()=>`<select onchange="sel.grade=this.value;sel.sub=null;render()">${opt(GR,sel.grade)}</select>`;
const exm=()=>`<input value="${esc(sel.exam)}" onchange="sel.exam=this.value;render()" placeholder="Exam name">`;
const LL=()=>D.learners.filter(l=>l.grade==sel.grade).sort((a,b)=>a.name.localeCompare(b.name));
const mk=(g,e,s)=>D.marks[slug(e)+"__"+slug(g)+"__"+slug(s)]?.scores||{};
function loginView(){$("v").innerHTML=`<div class="card"><b>Staff sign in</b><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (min 6 characters)"><div class="row"><button class="btn" onclick="login()">Sign in</button><button class="btn" style="background:var(--mu)" onclick="reg()">Register</button></div><small id="err" class="BE"></small><p><small>New teachers: register, then ask the admin to approve your account.</small></p></div>`}
const er=e=>{$("err").textContent=e.message.replace("Firebase: ","")};
function login(){auth.signInWithEmailAndPassword($("em").value.trim(),$("pw").value).catch(er)}
function reg(){auth.createUserWithEmailAndPassword($("em").value.trim(),$("pw").value).then(c=>db.doc("users/"+c.user.uid).set({email:c.user.email,role:"pending"})).catch(er)}
function render(){nav();if(!me)return loginView();const v=$("v");
if(role!="teacher"&&!admin){v.innerHTML='<div class="card"><b>Waiting for approval</b><p class="mu">Your account is registered. Ask the school admin to approve it, then reopen the app.</p></div>';return}
const L=LL(),S=subs(sel.grade);sel.sub=S.includes(sel.sub)?sel.sub:S[0];
if(tab=="Learners")v.innerHTML=`<div class="card">${gp()}${admin?`<textarea id="bulk" rows="4" placeholder="Paste names, one per line. Optional: ADM no, Name"></textarea><button class="btn" onclick="addL()">Add learners to ${sel.grade}</button>`:'<small>Only the admin can add learners.</small>'}</div>
<div class="card"><b>${L.length} learners</b>${L.map(l=>`<div class="lr"><span>${esc(l.adm?l.adm+" · ":"")+esc(l.name)}</span>${admin?`<button class="x" onclick="delL('${l.id}')">×</button>`:""}</div>`).join("")||'<p class="mu">None yet.</p>'}</div>`;
if(tab=="Marks"){const m=mk(sel.grade,sel.exam,sel.sub);v.innerHTML=`<div class="card">${gp()}${exm()}<select onchange="sel.sub=this.value;render()">${opt(S,sel.sub)}</select><small>Scores out of 100. Saved automatically (works offline, syncs later).</small></div>
<div class="card">${L.map(l=>`<div class="lr"><span>${esc(l.name)}</span><input type="number" inputmode="decimal" min="0" max="100" value="${m[l.id]??""}" oninput="setM('${l.id}',this.value)"></div>`).join("")||'<p class="mu">Add learners first.</p>'}</div>`}
if(tab=="Results"){const R=results(),cm=R.filter(r=>r.n),cmean=cm.length?cm.reduce((p,r)=>p+r.mean,0)/cm.length:0,cnt={EE:0,ME:0,AE:0,BE:0};cm.forEach(r=>cnt[lvl(r.mean)]++);
const sm=S.map((s,i)=>{const a=R.map(r=>r.sc[i]).filter(x=>x!=null);return a.length?a.reduce((p,c)=>p+c,0)/a.length:null});
v.innerHTML=`<div class="card">${gp()}${exm()}</div>
<div class="card"><b>Class mean: ${cmean.toFixed(1)}%</b> <b class="${lvl(cmean)}">${lvl(cmean)}</b><div class="row" style="margin-top:8px;text-align:center">${Object.keys(cnt).map(k=>`<div><b class="${k}">${cnt[k]}</b><br><small>${k}</small></div>`).join("")}</div></div>
<div class="card sc"><table><tr><th>#</th><th>Name</th>${S.map(s=>`<th>${s.slice(0,4)}</th>`).join("")}<th>Total</th><th>Mean</th><th>Lvl</th></tr>
${R.map((r,i)=>`<tr class="cl" onclick="card('${r.l.id}')"><td>${i+1}</td><td>${esc(r.l.name)}</td>${r.sc.map(x=>`<td>${x??"–"}</td>`).join("")}<td><b>${r.t}</b></td><td>${r.n?r.mean.toFixed(1):"–"}</td><td><b class="${r.n?lvl(r.mean):""}">${r.n?lvl(r.mean):""}</b></td></tr>`).join("")}
<tr><td></td><td><b>Subject mean</b></td>${sm.map(x=>`<td>${x==null?"–":x.toFixed(0)}</td>`).join("")}<td></td><td></td><td></td></tr></table></div>
<button class="btn" onclick="csv()">Download results (CSV)</button><p><small>Tap a learner for the report card. EE 75–100 · ME 50–74 · AE 25–49 · BE 0–24.</small></p>`}
if(tab=="Fees"){const fee=D.fees[sel.grade]||0;let tot=0,out=0;const rows=L.map(l=>{const p=D.pay.filter(x=>x.lid==l.id).reduce((a,x)=>a+x.amount,0);tot+=p;out+=Math.max(0,fee-p);return`<div class="lr"><span>${esc(l.name)}<br><small>Paid ${p.toLocaleString()} · Bal <b class="${fee-p>0?"BE":"EE"}">${(fee-p).toLocaleString()}</b></small></span><input id="p${l.id}" type="number" inputmode="numeric" placeholder="KES"><button class="btn s" onclick="pay('${l.id}')">Pay</button></div>`}).join("");
v.innerHTML=`<div class="card">${gp()}<small>Yearly fee per learner (KES) for ${sel.grade}</small><input type="number" inputmode="numeric" value="${fee||""}" onchange="setFee(this.value)"><b>Collected ${tot.toLocaleString()} · Outstanding ${out.toLocaleString()}</b></div><div class="card">${rows||'<p class="mu">No learners.</p>'}</div>`}
if(tab=="Users")v.innerHTML=`<div class="card"><b>Staff accounts</b>${D.users.map(u=>`<div class="lr"><span>${esc(u.email)}</span><select onchange="db.doc('users/${u.id}').update({role:this.value})">${opt(["pending","teacher","admin"],u.role)}</select></div>`).join("")}</div>`}
function results(){const S=subs(sel.grade);return LL().map(l=>{let t=0,n=0;const sc=S.map(s=>{const x=mk(sel.grade,sel.exam,s)[l.id];if(x!=null){t+=x;n++;return x}return null});return{l,sc,t,n,mean:n?t/n:0}}).sort((a,b)=>b.t-a.t)}
function card(id){const R=results(),i=R.findIndex(r=>r.l.id==id),r=R[i],S=subs(sel.grade),lv=r.n?lvl(r.mean):"";const fee=D.fees[sel.grade],paid=D.pay.filter(x=>x.lid==id).reduce((a,x)=>a+x.amount,0);
$("rc").innerHTML=`<div class="pg"><div style="text-align:center"><h2 style="margin:0">Njoro Central Comprehensive School</h2><b>LEARNER PROGRESS REPORT</b><br><small>${esc(sel.exam)}</small></div><p><b>${esc(r.l.name)}</b><br><small>${esc(r.l.adm?"ADM "+r.l.adm+" · ":"")+sel.grade}</small></p>
<table><tr><th>Learning Area</th><th>Score</th><th>Level</th></tr>${S.map((s,k)=>`<tr><td>${s}</td><td>${r.sc[k]??"–"}</td><td><b class="${r.sc[k]!=null?lvl(r.sc[k]):""}">${r.sc[k]!=null?lvl(r.sc[k]):""}</b></td></tr>`).join("")}
<tr><td><b>Total / Mean</b></td><td><b>${r.t} / ${r.n?r.mean.toFixed(1):"–"}%</b></td><td><b class="${lv}">${lv}</b></td></tr></table>
<p>Position: <b>${i+1}</b> of ${R.length}</p><p><b>Comment:</b> ${lv?CM[lv]:"—"}</p>${admin&&fee?`<p><small>Fee balance: KES ${(fee-paid).toLocaleString()}</small></p>`:""}
<p style="margin-top:36px"><small>Class teacher: ________________ &nbsp; Head teacher: ________________ &nbsp; Stamp</small></p>
<div class="row np"><button class="btn" onclick="window.print()">Print / Save PDF</button><button class="btn" style="background:var(--mu)" onclick="$('rc').classList.remove('on')">Close</button></div></div>`;$("rc").classList.add("on")}
function csv(){const S=subs(sel.grade),R=results();const rows=[["Pos","Name","ADM",...S,"Total","Mean","Level"],...R.map((r,i)=>[i+1,r.l.name,r.l.adm,...r.sc.map(x=>x??""),r.t,r.n?r.mean.toFixed(1):"",r.n?lvl(r.mean):""])];
const b=new Blob([rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`${slug(sel.grade)}-${slug(sel.exam)}.csv`;a.click()}
async function addL(){const t=$("bulk").value.split("\n").map(x=>x.trim()).filter(Boolean);for(const x of t){const p=x.split(","),name=(p[1]||p[0]).trim(),adm=p[1]?p[0].trim():"";await db.collection("learners").add({name,adm,grade:sel.grade})}}
async function delL(id){if(confirm("Remove this learner?"))await db.doc("learners/"+id).delete()}
function setM(id,v){const k=slug(sel.exam)+"__"+slug(sel.grade)+"__"+slug(sel.sub),cur={...(D.marks[k]?.scores||{})};if(v==="")delete cur[id];else cur[id]=Math.max(0,Math.min(100,+v));
D.marks[k]={scores:cur};const meta={exam:sel.exam,grade:sel.grade,subject:sel.sub};clearTimeout(timers[k]);timers[k]=setTimeout(()=>{db.doc("marks/"+k).set({...meta,scores:cur});delete timers[k]},600)}
async function pay(id){const a=+$("p"+id).value;if(!a)return;await db.collection("payments").add({lid:id,amount:a,date:new Date().toISOString().slice(0,10)})}
async function setFee(v){await db.doc("settings/fees").set({...D.fees,[sel.grade]:+v||0})}
const typing=()=>{const a=document.activeElement;return a&&a.tagName=="INPUT"&&a.closest(".lr")};
const again=()=>{if(!typing())render()};
function stop(){unsubs.forEach(f=>f());unsubs=[]}
function start(){stop();const sn=(q,f)=>unsubs.push(q.onSnapshot(f,e=>console.log(e)));
sn(db.collection("learners"),s=>{D.learners=s.docs.map(d=>({id:d.id,...d.data()}));again()});
sn(db.collection("marks"),s=>{s.docs.forEach(d=>{if(!timers[d.id])D.marks[d.id]=d.data()});again()});
sn(db.doc("settings/fees"),s=>{D.fees=s.data()||{};again()});
if(admin){sn(db.collection("payments"),s=>{D.pay=s.docs.map(d=>({id:d.id,...d.data()}));again()});sn(db.collection("users"),s=>{D.users=s.docs.map(d=>({id:d.id,...d.data()}));again()})}}
let uu=()=>{};
auth.onAuthStateChanged(u=>{uu();stop();me=u;role=null;admin=false;$("so").style.display=u?"":"none";if(!u)return render();
uu=db.doc("users/"+u.uid).onSnapshot(s=>{const r=s.data()?.role||"pending";if(r!=role){role=r;admin=r=="admin";stop();if(role=="teacher"||admin)start()}render()},e=>console.log(e))});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
