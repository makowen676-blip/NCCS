return `<div class="sec">Today's lessons <small>${DAYF[di]}</small></div><div class="card">${L.map(x=>{const t=PT(x.p);return `<div class="lr"><span><b>${esc(x.s)}</b><br><small>${esc(lbl(x.g))} · lesson ${x.p}</small></span><small>${t.a}–${t.b}</small></div>`}).join("")}</div>`};
function ttView(){const modes=isSuper()?[["class","Class"],["teacher","Teacher"],["alloc","Lessons"]]:admin?[["class","Class"],["teacher","Teacher"]]:[["mine","My timetable"],["class","Class"]];
let m=sel.tm;if(!modes.some(x=>x[0]==m))m=sel.tm=modes[0][0];
let h=TERMSEL()+`<div class="seg">${modes.map(x=>`<button class="${x[0]==m?"on":""}" onclick="sel.tm='${x[0]}';sel.ttnote='';render()">${x[1]}</button>`).join("")}</div>`;
if(sel.ttnote)h+=`<div class="card"><small>${esc(sel.ttnote)}</small></div>`;
{const bad=clashes();if(bad.length&&admin)h+=`<div class="card"><b class="BE">⚠ ${bad.length} clash${bad.length==1?"":"es"}</b><br><small>${esc(bad.slice(0,6).join(" | "))}. Fix them by changing one of the lessons.</small></div>`}
const g=sel.ttg||(sel.ttg=GR[0]);
if(m=="mine"){const uid=me.uid,n=sublist().filter(x=>x.t==uid).length;
h+=`<div class="card"><b>My lessons this week</b> <small>· ${n} lesson${n==1?"":"s"}</small>${n?`<div class="sc">${gridFor("teacher",uid)}</div><button class="btn" onclick="printTT('teacher','${uid}')">🖨 Print my timetable</button>`:`<p class="mu" style="margin:8px 0 0">No lessons on the timetable for you yet. When the admin assigns your subjects and builds the timetable they will appear here.</p>`}</div>`}
if(m=="class"){h+=`<div class="card"><select onchange="sel.ttg=this.value;render()">${copt(g)}</select><div class="sc">${gridFor("class",g)}</div><small>${isSuper()?"Tap a box to set or change that lesson. ":"Only the super admin can change the timetable. "}Breaks, lunch and games are fixed for every class.</small><button class="btn" onclick="printTT('class','${g}')">🖨 Print this class</button>${isSuper()?`<div class="row"><button class="btn" onclick="autoTT(false)">⚡ Auto-fill this class</button><button class="btn" style="background:var(--be)" onclick="clrTT(false)">Clear class</button></div>`:""}</div>`}
if(m=="teacher"){const tl=D.users.filter(u=>u.role=="teacher"||u.role=="admin"),tid=sel.ttt&&tl.some(u=>u.id==sel.ttt)?sel.ttt:(tl[0]||{}).id;
h+=`<div class="card">${tl.length?`<select onchange="sel.ttt=this.value;render()">${tl.map(u=>`<option value="${u.id}" ${u.id==tid?"selected":""}>${esc(u.name||u.email)}</option>`).join("")}</select>`:`<p class="mu">No staff yet.</p>`}${tid?`<div class="sc">${gridFor("teacher",tid)}</div><small>${sublist().filter(x=>x.t==tid).length} lessons a week. This view is read-only; change lessons from the Class view.</small><button class="btn" onclick="printTT('teacher','${tid}')">🖨 Print this timetable</button>`:""}</div>`}
if(m=="alloc"){const S=subs(g);let tot=0;
const rows=S.map((s,k)=>{const n=les(g,s),pl=placed(g,s),tc=tchOf(g,s);tot+=n;return `<div class="lr"><span>${esc(s)}<br><small>${tc.length?esc(tc.map(u=>u.name||u.email).join(", ")):'<b class="BE">⚠ No teacher assigned (Staff tab)</b>'} · placed <b class="${pl<n?"BE":n?"EE":""}">${pl}/${n}</b></small></span><input type="number" inputmode="numeric" min="0" max="${cap(g)}" value="${n||""}" placeholder="0" onchange="setLes('${g}',${k},this.value)"></div>`}).join("");
h+=`<div class="card"><small>Lessons per week for each subject. Teachers are linked from the Staff tab (📚 Subjects taught).</small><select onchange="sel.ttg=this.value;render()">${copt(g)}</select>${rows}<small>Total <b class="${tot>cap(g)?"BE":""}">${tot}</b> of ${cap(g)} lesson slots a week (${noLast(g)?NP-1:NP} lessons a day, Monday to Friday).</small><button class="btn" style="background:var(--ae)" onclick="useSug(false)">Suggest lessons for ${esc(g)}</button></div>
<div class="card"><b>Build the timetable</b><br><small>Auto-fill places the lessons still missing and never puts one teacher in two classes at once. Lessons you placed by hand stay where they are.</small><button class="btn" onclick="autoTT(false)">⚡ Auto-fill ${esc(g)}</button><button class="btn" onclick="autoTT(true)">⚡ Auto-fill whole school</button><button class="btn" style="background:var(--ae)" onclick="useSug(true)">Suggest lessons for all classes</button><button class="btn" style="background:var(--be)" onclick="clrTT(true)">Clear whole timetable for this term</button>${termsWith().length?`<select id="cpt"><option value="">Copy from another term…</option>${termsWith().map(k=>`<option value="${k}">${tlabel(k)}</option>`).join("")}</select><button class="btn" style="background:var(--ae)" onclick="copyTerm()">Copy lessons and timetable here</button>`:""}</div>`}
return h+`<p class="mu" style="margin:6px 2px"><small>School day: lessons from 8:20 · short break 9:40–9:50 · long break 11:10–11:30 · lunch 12:50–2:00 · games 3:20–4:00. Each lesson is 40 minutes. The timetable is kept separately for each term. Grades 1–6 finish after lesson 7 (2:40pm); lesson 8 is blank for them.</small></p>`}
/* ---------- Messages: admin to an individual staff member, shown on their dashboard ---------- */
const fmtTs=t=>new Date(t).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const merr=e=>toast(e&&e.code=="permission-denied"?"Not saved: add the messages rule to your Firestore rules first":String((e&&e.message)||e).replace("Firebase: ",""));
const myMsgs=()=>me?(D.msgs||[]).filter(m=>m.to==me.uid).sort((a,b)=>b.ts-a.ts):[];
const msgCard=()=>{const M=myMsgs();if(!M.length)return"";const un=M.filter(m=>!m.read).length,V=sel.allm?M:M.slice(0,4);
return `<div class="sec">Messages ${un?`<small>${un} new</small>`:""}</div><div class="card">${V.map(m=>`<div class="lr" style="align-items:flex-start;${m.read?"":"background:var(--soft);border-radius:12px;padding:10px"}"><span>${m.bc?"📢 ":""}<b>${esc(m.fromName||"Admin")}</b> <small>${fmtTs(m.ts)}</small><br>${esc(m.text).replace(/\n/g,"<br>")}</span>${m.read?"":`<button class="btn s" style="margin:0" onclick="readMsg('${m.id}')">Got it</button>`}</div>`).join("")}${un>1?`<button class="lk" onclick="readAllMsgs()">Mark all as read</button> · `:""}${M.length>4?`<button class="lk" onclick="sel.allm=!sel.allm;render()">${sel.allm?"Show fewer":"Show all "+M.length}</button>`:""}</div>`};

/* ---------- Alert: learning areas with over 15 learners without marks (active exam of the class) ---------- */
const MISS=15;
const missFor=asg=>{const out=[];(asg||[]).forEach(a=>{const p=a.split("::"),g=p[0],sb=p[1];if(!CL.includes(g)||!subs(g).includes(sb))return;const e=actEx(g);if(!e)return;const L=D.learners.filter(l=>l.grade==g),m=mk(g,e,sb),miss=L.filter(l=>m[l.id]==null).length;if(miss>MISS)out.push({g,s:sb,e,miss,tot:L.length})});return out.sort((a,b)=>b.miss-a.miss)};
const remTxt=it=>"Reminder: please upload marks for "+it.map(x=>lbl(x.g)+" "+x.s+" ("+x.miss+" learners still without marks)").join("; ")+". Thank you.";
const alertCards=()=>{let h="";if(admin)h+=`<button class="btn" style="margin-bottom:12px" onclick="msgAll()">📢 Broadcast message to all staff</button>`;
if(!(aeOk&&mOk))return h;
if(!admin){const A=missFor(myAsg);if(A.length)h+=`<div class="card" style="border-left:5px solid var(--be)"><b class="BE">⚠ ${A.length} learning area${A.length>1?"s":""} with over ${MISS} learners without marks</b><small style="display:block;margin:2px 0 6px">Tap one to enter the marks now.</small>${A.map(x=>`<div class="lr" style="cursor:pointer" onclick="openAsg(${myAsg.indexOf(x.g+"::"+x.s)})"><span><b>${esc(x.s)}</b><br><small>${esc(x.g)} · ${esc(x.e)}</small></span><b class="BE">${x.miss}/${x.tot} missing</b></div>`).join("")}</div>`}
else{const T=D.users.filter(u=>u.role=="teacher"||u.role=="admin").map(u=>({u,A:missFor(u.assign)})).filter(t=>t.A.length);
if(T.length){const n=T.reduce((a,t)=>a+t.A.length,0);h+=`<div class="card" style="border-left:5px solid var(--be)"><b class="BE">⚠ ${n} learning area${n>1?"s":""} with over ${MISS} learners without marks</b><small style="display:block;margin:2px 0 6px">${T.length} teacher${T.length>1?"s":""} to follow up.</small>${T.map(t=>`<div style="padding:8px 0;border-top:1px solid var(--bd)"><div class="lr" style="border:0;padding:0"><span><b>${esc(t.u.name||t.u.email)}</b></span><button class="btn s" style="margin:0;flex:0 0 auto" onclick="remind('${t.u.id}')">✉ Remind</button></div>${t.A.map(x=>`<small style="display:block">${esc(lbl(x.g))} · ${esc(x.s)} · <b class="BE">${x.miss}/${x.tot} missing</b></small>`).join("")}</div>`).join("")}<div class="row" style="margin-top:8px"><button class="btn" onclick="remind('')">✉ Remind all of them</button><button class="btn" style="background:var(--mu)" onclick="refreshMarks()">Refresh</button></div></div>`}}
return h};
function remind(uid){if(!admin)return;const T=D.users.filter(u=>(u.role=="teacher"||u.role=="admin")&&(uid?u.id==uid:u.id!=me.uid)).map(u=>({u,A:missFor(u.assign)})).filter(t=>t.A.length);if(!T.length)return;
if(uid)return msgTo(uid,remTxt(T[0].A));
ask("Send a reminder to "+T.length+" teacher"+(T.length>1?"s":"")+" about their missing marks?","Send",async()=>{try{const b=db.batch(),ts=Date.now();T.forEach(t=>b.set(db.collection("messages").doc(),{to:t.u.id,toName:t.u.name||t.u.email,from:me.uid,fromName:myName||me.displayName||me.email,text:remTxt(t.A).slice(0,1000),ts,read:false}));await b.commit();toast("Reminders sent")}catch(e){merr(e)}})}
/* ---------- Broadcast: one message to every approved staff member ---------- */
function msgAll(){if(!admin)return;const R=D.users.filter(u=>(u.role=="teacher"||u.role=="admin")&&u.id!=me.uid);if(!R.length)return toast("No approved staff to message yet");const m=document.createElement("div");m.id="md";
m.innerHTML=`<div class="bx" style="max-width:380px;max-height:85vh;overflow:auto"><b>📢 Broadcast to all staff</b><small style="display:block;margin:2px 0 6px">Goes to ${R.length} staff member${R.length>1?"s":""} (teachers and admins). Each sees it on their dashboard.</small><textarea id="mtx" rows="5" maxlength="1000" placeholder="Type your message…"></textarea><div class="row" style="margin-top:10px"><button class="btn" style="background:var(--mu)" id="mc">Cancel</button><button class="btn" id="ms">Send to all</button></div></div>`;
document.body.appendChild(m);m.querySelector("#mc").onclick=()=>m.remove();
m.querySelector("#ms").onclick=async()=>{const t=m.querySelector("#mtx").value.trim();if(!t)return toast("Type a message first");const bt=m.querySelector("#ms");bt.disabled=true;
try{const b=db.batch(),ts=Date.now(),fn=myName||me.displayName||me.email;R.forEach(u=>b.set(db.collection("messages").doc(),{to:u.id,toName:u.name||u.email,from:me.uid,fromName:fn,text:t.slice(0,1000),ts,read:false,bc:true}));await b.commit();m.remove();toast("Broadcast sent to "+R.length+" staff")}catch(e){bt.disabled=false;merr(e)}}}
function readMsg(id){db.doc("messages/"+id).update({read:true,readAt:Date.now()}).catch(merr)}
function readAllMsgs(){myMsgs().filter(m=>!m.read).forEach(m=>readMsg(m.id))}
function msgTo(uid,pre){if(!admin)return;const u=D.users.find(x=>x.id==uid);if(!u)return;const nm=u.name||u.email,m=document.createElement("div");m.id="md";
const H=(D.msgs||[]).filter(x=>x.to==uid&&x.from==me.uid).sort((a,b)=>b.ts-a.ts).slice(0,4);
m.innerHTML=`<div class="bx" style="max-width:380px;max-height:85vh;overflow:auto"><b>✉ Message to ${esc(nm)}</b><small style="display:block;margin:2px 0 6px">They will see it on their dashboard.</small><textarea id="mtx" rows="4" maxlength="1000" placeholder="Type your message…">${esc(pre||"")}</textarea>${H.length?`<small>Your recent messages to ${esc(first(nm))}</small>${H.map(x=>`<div class="lr" style="align-items:flex-start"><span><small>${fmtTs(x.ts)} · ${x.read?"✓ Read":"Not read yet"}</small><br>${esc(x.text).replace(/\n/g,"<br>")}</span><button class="x" onclick="delMsg('${x.id}','${uid}')">×</button></div>`).join("")}`:""}<div class="row" style="margin-top:10px"><button class="btn" style="background:var(--mu)" id="mc">Close</button><button class="btn" id="ms">Send</button></div></div>`;
document.body.appendChild(m);m.querySelector("#mc").onclick=()=>m.remove();
m.querySelector("#ms").onclick=async()=>{const t=m.querySelector("#mtx").value.trim();if(!t)return toast("Type a message first");
try{await db.collection("messages").add({to:uid,toName:nm,from:me.uid,fromName:myName||me.displayName||me.email,text:t.slice(0,1000),ts:Date.now(),read:false});m.remove();toast("Message sent to "+first(nm))}catch(e){merr(e)}}}
function delMsg(id,uid){if(!admin)return;const o=$("md");if(o)o.remove();ask("Delete this message? It disappears from their dashboard too.","Delete",async()=>{try{await db.doc("messages/"+id).delete();D.msgs=(D.msgs||[]).filter(x=>x.id!=id);toast("Message deleted")}catch(e){merr(e)}msgTo(uid)})}
/* ---------- Attendance register ---------- */
let AT={key:null,busy:null,absent:new Set(),saved:false,rep:""};
const adate=()=>sel.adate||td(),akey=()=>slug(sel.grade)+"__"+adate();
function regHTML(){if(!sel.cpick)return `<div class="card">${lab("Class")}${gp()}<p class="mu" style="margin:8px 0 0">👆 Choose a class to take the register.</p></div>`;
const L=LL(),can=admin||myCl.includes(sel.grade),ready=AT.key==akey(),ab=n=>L.filter(l=>AT.absent.has(l.id)).length;
let h=`<div class="card">${lab("Class")}${gp()}${lab("Date")}<input type="date" value="${adate()}" max="${td()}" onchange="if(this.value){sel.adate=this.value;AT.key=null;render()}">`;
if(!ready)h+=`<p class="mu">Loading register…</p></div>`;
else if(!L.length)h+=`<p class="mu">No learners in this class yet.</p></div>`;
else{h+=`<div class="chip" style="margin:8px 0"><b id="acnt">Present ${L.length-ab()} · Absent ${ab()}</b><small> of ${L.length} learners${AT.saved?" · saved":" · not saved yet"}</small><div class="bar"><i id="abar" style="width:${L.length?(L.length-ab())/L.length*100:0}%"></i></div></div>${can?"":`<small class="BE">You can only take the register for your own classes.</small>`}`+
L.map(l=>`<div class="lr"><div class="av">${esc(l.name.trim().charAt(0).toUpperCase()||"?")}</div><span>${esc(l.name)}</span><button class="tg ${AT.absent.has(l.id)?"ab":"pr"}" ${can?`onclick="togAbs('${l.id}',this)"`:"disabled"}>${AT.absent.has(l.id)?"Absent":"Present"}</button></div>`).join("")+`</div>${can?`<button class="btn" onclick="saveAtt()">💾 Save register</button>`:""}`}
const mo=sel.amonth||td().slice(0,7);
h+=`<div class="card">${lab("Attendance report")}<input type="month" value="${mo}" onchange="sel.amonth=this.value"><button class="btn" onclick="attReport()">Show report for this month</button>${AT.rep}</div>`;return h}
async function loadAtt(){if(!sel.cpick)return;const k=akey();if(AT.key==k||AT.busy==k)return;AT.busy=k;let ab=new Set(),sv=false;
try{const s=await db.doc("attendance/"+k).get();if(s.exists){ab=new Set(s.data().absent||[]);sv=true}}catch(e){toast(e.code=="permission-denied"?"Register needs the new Firebase rules (see notes)":String(e.message||e).replace("Firebase: ",""))}
AT.busy=null;if(akey()!=k)return;AT.key=k;AT.absent=ab;AT.saved=sv;if(tab=="Register")render()}
function togAbs(id,b){if(AT.absent.has(id))AT.absent.delete(id);else AT.absent.add(id);AT.saved=false;const a=AT.absent.has(id);b.textContent=a?"Absent":"Present";b.className="tg "+(a?"ab":"pr");const L=LL(),n=L.filter(l=>AT.absent.has(l.id)).length,c=$("acnt");if(c){c.textContent="Present "+(L.length-n)+" · Absent "+n;c.nextElementSibling.textContent=" of "+L.length+" learners · not saved yet"}const br=$("abar");if(br)br.style.width=(L.length?(L.length-n)/L.length*100:0)+"%"}
async function saveAtt(){const ids=new Set(LL().map(l=>l.id)),k=akey();try{await db.doc("attendance/"+k).set({grade:sel.grade,date:adate(),absent:[...AT.absent].filter(i=>ids.has(i)),by:(me&&me.email)||"",t:Date.now()});AT.saved=true;toast("Register saved");render()}catch(e){toast(e.code=="permission-denied"?"Not allowed. Admin must add the new Firebase rules (see notes)":String(e.message||e).replace("Firebase: ",""))}}
async function attReport(){const mo=sel.amonth||td().slice(0,7),g=sel.grade,pre=slug(g)+"__",FP=firebase.firestore.FieldPath.documentId();AT.rep=`<p class="mu">Loading…</p>`;render();
try{const s=await db.collection("attendance").where(FP,">=",pre+mo+"-01").where(FP,"<=",pre+mo+"-31").get(),days=s.docs.length,cnt={};s.docs.forEach(d=>(d.data().absent||[]).forEach(i=>cnt[i]=(cnt[i]||0)+1));
AT.rep=days?`<p><small>Days registered in ${mo}: <b>${days}</b></small></p><table style="width:100%;border-collapse:collapse;font-size:14px"><tr><th style="text-align:left">Learner</th><th>Days absent</th><th>Attendance</th></tr>${LL().map(l=>{const a=cnt[l.id]||0;return `<tr style="border-top:1px solid var(--bd)"><td>${esc(l.name)}</td><td style="text-align:center">${a}</td><td style="text-align:center"><b class="${(days-a)/days>=.9?"EE":(days-a)/days>=.75?"AE":"BE"}">${Math.round((days-a)/days*100)}%</b></td></tr>`}).join("")}</table>`:`<p class="mu">No registers saved for ${g} in ${mo}.</p>`}catch(e){AT.rep=`<p class="BE">${e.code=="permission-denied"?"Register needs the new Firebase rules (see notes).":esc(String(e.message||e))}</p>`}render()}

async function backup(){if(!admin)return;toast("Preparing backup…");try{await loadX()}catch(e){return toast("Excel needs internet the first time. Try again online.")}
try{const ms=await db.collection("marks").get(),L={};D.learners.forEach(l=>L[l.id]=l);const wb=new ExcelJS.Workbook();wb.creator="NCCS School Manager";
const sh=(n,cols,rows)=>{const w=wb.addWorksheet(n,{views:[{state:"frozen",ySplit:1}]});w.addRow(cols).font={bold:true};rows.forEach(r=>w.addRow(r));w.columns.forEach(c=>c.width=18);return w};
const gn=g=>isSNE(g)?10+SNEL.indexOf(g):+String(g).split(" ")[1]||0;
sh("Learners",["Grade","ADM","Name"],[...D.learners].sort((a,b)=>gn(a.grade)-gn(b.grade)||a.name.localeCompare(b.name)).map(l=>[l.grade,l.adm||"",l.name]));
const mr=[];ms.docs.forEach(d=>{const m=d.data();Object.entries(m.scores||{}).forEach(([id,x])=>{const l=L[id]||{};mr.push([m.exam,m.grade,m.subject,l.adm||"",l.name||"(removed learner)",x])})});mr.sort((a,b)=>String(a[0]).localeCompare(String(b[0]))||gn(a[1])-gn(b[1])||String(a[2]).localeCompare(String(b[2]))||String(a[4]).localeCompare(String(b[4])));
sh("Marks",["Exam","Grade","Subject","ADM","Name","Score"],mr);
sh("Payments",["Date","Year","Grade","ADM","Name","Amount (KES)"],[...D.pay].sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(x=>{const l=L[x.lid]||{};return [x.date,x.year||"",x.grade||l.grade||"",l.adm||"",x.name||l.name||"",x.amount]}));
sh("Fees per grade",["Grade","Yearly fee (KES)"],CL.map(g=>[g,D.fees[g]||0]));
const buf=await wb.xlsx.writeBuffer(),b=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="nccs-backup-"+td()+".xlsx";a.click();toast("Backup downloaded")}catch(e){toast(String(e.message||e).replace("Firebase: ",""))}}

let uu=()=>{};
auth.onAuthStateChanged(u=>{uu();stop();me=u;role=null;admin=false;$("so").style.display=u?"":"none";if(!u)return render();
uu=db.doc("users/"+u.uid).onSnapshot(s=>{const r=s.data()?.role||"pending";myCl=s.data()?.classes||[];myAsg=s.data()?.assign||[];myName=s.data()?.name||"";if(r!="admin"&&myCl.length&&!myCl.includes(sel.grade)&&!sel.cl0){sel.grade=myCl[0];sel.cl0=1}if(r!=role){role=r;admin=r=="admin";stop();if(role=="teacher"||admin)start()}render()},e=>console.log(e))});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
