if(!cb)return;if(/by the end of/i.test(c))inO=true;else if(/^(suggested|key inquiry|core comp|values|pertinent|link to other|assessment)/i.test(c)&&!/^[a-j]\)/i.test(c))inO=false;

async function xSave(){const p=EX.paper;if(!p||p.saved)return;if(!p.secs.length)return toast("Nothing to save yet");
const doc={title:p.title,date:p.date,grade:p.grade,subject:p.subject,kind:p.kind,minutes:p.minutes,instr:p.instr,secs:p.secs.map(s=>({letter:s.letter,type:s.type,items:s.items.map(i=>({no:i.no,qid:i.qid,q:i.q,a:i.a,opts:i.opts,strand:i.strand||"",marks:i.marks}))})),total:p.total,by:me.uid,byName:myName||me.email,t:Date.now()};
try{await db.collection("papers").add(doc);p.saved=true;toast("Paper saved");render();
try{const b=db.batch();p.secs.forEach(s=>s.items.forEach(i=>b.update(db.doc("questions/"+i.qid),{used:firebase.firestore.FieldValue.increment(1)})));await b.commit()}catch(e){console.log(e)}}catch(e){xerr(e)}}
function pvView(){const L=(D.papers||[]).filter(p=>admin||p.by==(me&&me.uid)).sort((a,b)=>(b.t||0)-(a.t||0));
if(!L.length)return `<div class="card"><b>No saved papers</b><p class="mu">Generate a paper and tap Save to keep it here for printing again.</p></div>${qHTML()}`;
return `<div class="card"><b>${L.length} saved paper${L.length==1?"":"s"}</b>${L.slice(0,40).map(p=>`<div class="lr" style="align-items:flex-start"><span><b>${esc(p.title)}</b><br><small>${esc(p.grade)} · ${esc(p.subject)} · ${p.total} marks · ${new Date(p.t||0).toLocaleDateString("en-GB")}${admin&&p.byName?" · "+esc(first(p.byName)):""}</small></span><button class="x" style="color:var(--ac);font-size:14px" onclick="xShow(0,'${p.id}')">Paper</button><button class="x" style="color:var(--ee);font-size:14px" onclick="xShow(1,'${p.id}')">Scheme</button>${admin||p.by==(me&&me.uid)?`<button class="x" onclick="pvDel('${p.id}')">×</button>`:""}</div>`).join("")}</div>`}
function pvDel(id){ask("Delete this saved paper?","Delete",()=>db.doc("papers/"+id).delete().catch(xerr))}
const XINS={quiz:["Write your name, admission number and class in the spaces provided.","Answer ALL the questions.","Marks for each question are shown in brackets at the end of the question.","Write your answers in the spaces provided."],exam:["Write your name, admission number and class in the spaces provided above.","Answer ALL the questions in this paper.","Marks for each question are shown in brackets at the end of the question.","Write your answers in the spaces provided after each question.","Check that all the pages are printed and that no question is missing."]};
const XSI={MCQ:"Answer ALL the questions. Choose the best answer from the options A, B, C or D.",Short:"Answer ALL the questions in the spaces provided.",Structured:"Answer ALL the questions in the spaces provided.",Essay:"Answer the question(s) in the spaces provided."};
function xTime(m){return m<60?m+" minutes":Math.floor(m/60)+" hour"+(m>=120?"s":"")+(m%60?" "+m%60+" minutes":"")}
function paperHTML(p,ms){const tm=p.minutes||(p.kind=="quiz"?30:p.total>=80?120:p.total>=40?90:45),n=p.secs.reduce((a,s)=>a+s.items.length,0),ml=m=>"("+m+" mark"+(m==1?"":"s")+")";
const ins=(p.instr&&p.instr.length?p.instr:XINS[p.kind=="quiz"?"quiz":"exam"]);
const head=`${anHead()}<div class="ttl">${ms?"MARKING SCHEME":p.kind=="quiz"?"WEEKLY QUIZ":"EXAMINATION"}</div>
<table><tr><th class="l">Learning area</th><td class="l">${esc(p.subject)}</td><th>Class</th><td>${esc(p.grade)}</td></tr><tr><th class="l">Assessment</th><td class="l">${esc(p.title)}</td><th>Date</th><td>${p.date?fmtD(p.date):""}</td></tr><tr><th class="l">${ms?"Questions":"Time"}</th><td class="l">${ms?n:xTime(tm)}</td><th>Total marks</th><td><b>${p.total}</b></td></tr></table>`;
if(ms){return head+p.secs.map(s=>`<div class="xs"><span>SECTION ${s.letter}: ${XTN[s.type].toUpperCase()}</span><span>${s.items.reduce((a,i)=>a+i.marks,0)} marks</span></div><table><tr><th>No.</th><th class="l">Answer / marking guide</th><th>Strand</th><th>Marks</th></tr>${s.items.map(i=>`<tr><td>${i.no}</td><td class="l" style="white-space:pre-wrap">${s.type=="MCQ"?"<b>"+esc(i.a)+"</b>"+(i.opts&&i.opts["ABCD".indexOf(i.a)]?". "+esc(i.opts["ABCD".indexOf(i.a)]):""):esc(i.a)}</td><td>${esc(i.strand||"")}</td><td><b>${i.marks}</b></td></tr>`).join("")}</table>`).join("")+`<table><tr class="tot"><td class="l">Total</td><td></td><td></td><td>${p.total}</td></tr></table><div class="xe">*** END OF MARKING SCHEME ***</div>`}
const lines=(t,m)=>{const c=t=="Short"?Math.min(3,Math.max(1,Math.round(m))):t=="Structured"?Math.min(10,Math.max(2,Math.round(m))):Math.min(16,Math.max(8,Math.round(m)+4));return Array(c).fill('<div class="al"></div>').join("")};
return head+`<div class="xl"><span>Name:<i></i></span><span>Adm No:<i></i></span></div><div class="xl"><span>Class:<i></i></span><span>Signature:<i></i></span></div>
<div class="xi"><b>Instructions to learners</b><ol>${ins.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`+p.secs.map(s=>`<div class="xs"><span>SECTION ${s.letter}: ${XTN[s.type].toUpperCase()}</span><span>${s.items.reduce((a,i)=>a+i.marks,0)} marks</span></div><div class="xt">${XSI[s.type]}</div>${s.items.map(i=>`<div class="xq"><b>${i.no}.</b><div class="xb"><div style="white-space:pre-wrap">${esc(i.q)} <span class="xm">${ml(i.marks)}</span></div>${s.type=="MCQ"&&i.opts&&i.opts.length?`<div class="xo">${i.opts.map((o,k)=>`<span>${"ABCD"[k]}. ${esc(o)}</span>`).join("")}</div>`:s.type=="MCQ"?"":lines(s.type,i.marks)}</div></div>`).join("")}`).join("")+`<div class="xe">*** END OF PAPER ***</div>`}
function xShow(ms,src){let p=null;if(src=="cur")p=EX.paper;else p=(D.papers||[]).find(x=>x.id==src);if(!p)return toast("Paper not found");
const ctl=`<div class="np card" style="max-width:700px;margin:0 auto 12px"><b>${ms?"Marking scheme":"Exam paper"}</b> · ${esc(p.title)}<div class="row" style="margin-top:8px"><button class="btn" onclick="window.print()">🖨 Print / Save as PDF</button><button class="btn" style="background:var(--ae)" onclick="xShow(${ms?0:1},'${src}')">${ms?"Show paper":"Show marking scheme"}</button></div><button class="btn" style="background:var(--mu)" onclick="$('rc').classList.remove('on')">Close</button></div>`;
$("rc").innerHTML=ctl+`<div class="pg wide"><div class="rpt xp">${paperHTML(p,ms)}</div></div>`;$("rc").classList.add("on");$("rc").scrollTop=0}

/* ---------- Hook: runs after every render ---------- */
function xAfter(){const v=$("v");if(!v||!me)return;
if(tab=="Exams"||tab=="Analysis")document.documentElement.dataset.band="js";
if(role=="pending"){if(!v.querySelector(".qbox"))v.insertAdjacentHTML("beforeend",qHTML());return}
if(role!="teacher"&&!admin)return;
if(tab=="Marks"&&sel.cpick&&sel.msub&&v.querySelector("#mprog")&&!v.querySelector("#xdl")){const sb=v.querySelector(".savebar"),h=`<div id="xdl">${dlCard()}</div>`;sb?sb.insertAdjacentHTML("beforebegin",h):v.insertAdjacentHTML("beforeend",h)}
const t=v.textContent||"";if((v.querySelector(".empty")||t.indexOf("👆")>=0||/None yet\./.test(t)||(tab=="Results"&&/No marks entered yet/.test(t)))&&!v.querySelector(".qbox"))v.insertAdjacentHTML("beforeend",qHTML())}
{const _r=render;render=function(){_r.apply(this,arguments);try{xAfter()}catch(e){console.log(e)}}}

let uu=()=>{};
auth.onAuthStateChanged(u=>{uu();stop();me=u;role=null;admin=false;$("so").style.display=u?"":"none";if(!u)return render();
uu=db.doc("users/"+u.uid).onSnapshot(s=>{const r=s.data()?.role||"pending";myCl=s.data()?.classes||[];myAsg=s.data()?.assign||[];myName=s.data()?.name||"";if(r!="admin"&&myCl.length&&!myCl.includes(sel.grade)&&!sel.cl0){sel.grade=myCl[0];sel.cl0=1}if(r!=role){role=r;admin=r=="admin";stop();if(role=="teacher"||admin)start()}render()},e=>console.log(e))});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
