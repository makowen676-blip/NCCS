<div class="row np" style="margin-top:14px"><button class="btn" onclick="window.print()">Print / Save PDF</button><button class="btn" onclick="fcsv()">Download CSV</button><button class="btn" style="background:var(--mu)" onclick="$('rc').classList.remove('on')">Close</button></div></div>`;$("rc").classList.add("on")}
function fcsv(){const rows=[["Date","Learner","Grade","Amount"],...(window.lastP||[]).map(x=>{const i=payInfo(x);return[x.date,i.name,i.grade,x.amount]})];const b=new Blob([rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`fees-${fr.from}-to-${fr.to}.csv`;a.click()}
async function setFee(v){await db.doc("settings/fees").set({...D.fees,[sel.grade]:+v||0})}
const typing=()=>{const a=document.activeElement;return a&&a.tagName=="INPUT"&&a.closest(".lr")};
const again=()=>{if(!typing())render()};
let mUn=null,mGrade=null,aeDone=null;
function stop(){unsubs.forEach(f=>f());unsubs=[];if(mUn){mUn();mUn=null}mGrade=null;aeDone=null}
/* Reads saver: live-listen only to the selected class's marks; the active exam of other classes is fetched once */
function watchMarks(){if(!me||!(role=="teacher"||admin))return;if(mGrade==sel.grade)return;if(mUn){mUn();mUn=null}const g=sel.grade;mGrade=g;
mUn=db.collection("marks").where("grade","==",g).onSnapshot(s=>{const ids=new Set(s.docs.map(d=>d.id));Object.keys(D.marks).forEach(k=>{if(D.marks[k].grade==g&&!ids.has(k)&&!timers[k])delete D.marks[k]});s.docs.forEach(d=>{if(!timers[d.id])D.marks[d.id]=d.data()});again()},e=>console.log(e))}
function loadActive(){const ex=D.act&&D.act.exam;if(!ex||aeDone==ex||!me)return;aeDone=ex;db.collection("marks").where("exam","==",ex).get().then(s=>{s.docs.forEach(d=>{const m=d.data();if(!timers[d.id]&&m.grade!=mGrade)D.marks[d.id]=m});again()}).catch(e=>console.log(e))}
function start(){stop();const sn=(q,f)=>unsubs.push(q.onSnapshot(f,e=>console.log(e)));
sn(db.collection("learners"),s=>{D.learners=s.docs.map(d=>({id:d.id,...d.data()}));again()});
watchMarks();
sn(db.doc("settings/fees"),s=>{D.fees=s.data()||{};again()});
sn(db.doc("settings/exam"),s=>{D.act=s.data()||null;loadActive();again()});
if(admin){sn(db.collection("payments"),s=>{D.pay=s.docs.map(d=>({id:d.id,...d.data()}));again()});sn(db.collection("users"),s=>{D.users=s.docs.map(d=>({id:d.id,...d.data()}));again()})}}
/* ---------- Attendance register ---------- */
let AT={key:null,busy:null,absent:new Set(),saved:false,rep:""};
const adate=()=>sel.adate||td(),akey=()=>slug(sel.grade)+"__"+adate();
function regHTML(){if(!sel.cpick)return `<div class="card">${lab("Class")}${gp()}<p class="mu" style="margin:8px 0 0">👆 Choose a class to take the register.</p></div>`;
const L=LL(),can=admin||myCl.includes(sel.grade),ready=AT.key==akey(),ab=n=>L.filter(l=>AT.absent.has(l.id)).length;
let h=`<div class="card">${lab("Class")}${gp()}${lab("Date")}<input type="date" value="${adate()}" max="${td()}" onchange="if(this.value){sel.adate=this.value;AT.key=null;render()}">`;
if(!ready)h+=`<p class="mu">Loading register…</p></div>`;
else if(!L.length)h+=`<p class="mu">No learners in this class yet.</p></div>`;
else{h+=`<div class="chip" style="margin:8px 0"><b id="acnt">Present ${L.length-ab()} · Absent ${ab()}</b><small> of ${L.length} learners${AT.saved?" · saved":" · not saved yet"}</small></div>${can?"":`<small class="BE">You can only take the register for your own classes.</small>`}`+
L.map(l=>`<div class="lr"><div class="av">${esc(l.name.trim().charAt(0).toUpperCase()||"?")}</div><span>${esc(l.name)}</span><button class="btn" style="width:auto;margin:0;min-width:92px;padding:8px 10px;font-size:13px;background:${AT.absent.has(l.id)?"var(--be)":"var(--ee)"}" ${can?`onclick="togAbs('${l.id}',this)"`:"disabled"}>${AT.absent.has(l.id)?"Absent":"Present"}</button></div>`).join("")+`</div>${can?`<button class="btn" onclick="saveAtt()">💾 Save register</button>`:""}`}
const mo=sel.amonth||td().slice(0,7);
h+=`<div class="card">${lab("Attendance report")}<input type="month" value="${mo}" onchange="sel.amonth=this.value"><button class="btn" onclick="attReport()">Show report for this month</button>${AT.rep}</div>`;return h}
async function loadAtt(){if(!sel.cpick)return;const k=akey();if(AT.key==k||AT.busy==k)return;AT.busy=k;let ab=new Set(),sv=false;
try{const s=await db.doc("attendance/"+k).get();if(s.exists){ab=new Set(s.data().absent||[]);sv=true}}catch(e){toast(e.code=="permission-denied"?"Register needs the new Firebase rules (see notes)":String(e.message||e).replace("Firebase: ",""))}
AT.busy=null;if(akey()!=k)return;AT.key=k;AT.absent=ab;AT.saved=sv;if(tab=="Register")render()}
function togAbs(id,b){if(AT.absent.has(id))AT.absent.delete(id);else AT.absent.add(id);AT.saved=false;const a=AT.absent.has(id);b.textContent=a?"Absent":"Present";b.style.background=a?"var(--be)":"var(--ee)";const L=LL(),n=L.filter(l=>AT.absent.has(l.id)).length,c=$("acnt");if(c){c.textContent="Present "+(L.length-n)+" · Absent "+n;c.nextElementSibling.textContent=" of "+L.length+" learners · not saved yet"}}
async function saveAtt(){const ids=new Set(LL().map(l=>l.id)),k=akey();try{await db.doc("attendance/"+k).set({grade:sel.grade,date:adate(),absent:[...AT.absent].filter(i=>ids.has(i)),by:(me&&me.email)||"",t:Date.now()});AT.saved=true;toast("Register saved");render()}catch(e){toast(e.code=="permission-denied"?"Not allowed. Admin must add the new Firebase rules (see notes)":String(e.message||e).replace("Firebase: ",""))}}
async function attReport(){const mo=sel.amonth||td().slice(0,7),g=sel.grade,pre=slug(g)+"__",FP=firebase.firestore.FieldPath.documentId();AT.rep=`<p class="mu">Loading…</p>`;render();
try{const s=await db.collection("attendance").where(FP,">=",pre+mo+"-01").where(FP,"<=",pre+mo+"-31").get(),days=s.docs.length,cnt={};s.docs.forEach(d=>(d.data().absent||[]).forEach(i=>cnt[i]=(cnt[i]||0)+1));
AT.rep=days?`<p><small>Days registered in ${mo}: <b>${days}</b></small></p><table style="width:100%;border-collapse:collapse;font-size:14px"><tr><th style="text-align:left">Learner</th><th>Days absent</th><th>Attendance</th></tr>${LL().map(l=>{const a=cnt[l.id]||0;return `<tr style="border-top:1px solid var(--bd)"><td>${esc(l.name)}</td><td style="text-align:center">${a}</td><td style="text-align:center"><b>${Math.round((days-a)/days*100)}%</b></td></tr>`}).join("")}</table>`:`<p class="mu">No registers saved for ${g} in ${mo}.</p>`}catch(e){AT.rep=`<p class="BE">${e.code=="permission-denied"?"Register needs the new Firebase rules (see notes).":esc(String(e.message||e))}</p>`}render()}

async function backup(){if(!admin)return;toast("Preparing backup…");try{await loadX()}catch(e){return toast("Excel needs internet the first time. Try again online.")}
try{const ms=await db.collection("marks").get(),L={};D.learners.forEach(l=>L[l.id]=l);const wb=new ExcelJS.Workbook();wb.creator="NCCS School Manager";
const sh=(n,cols,rows)=>{const w=wb.addWorksheet(n,{views:[{state:"frozen",ySplit:1}]});w.addRow(cols).font={bold:true};rows.forEach(r=>w.addRow(r));w.columns.forEach(c=>c.width=18);return w};
const gn=g=>isSNE(g)?10+SNEL.indexOf(g):+String(g).split(" ")[1]||0;
sh("Learners",["Grade","ADM","Name"],[...D.learners].sort((a,b)=>gn(a.grade)-gn(b.grade)||a.name.localeCompare(b.name)).map(l=>[l.grade,l.adm||"",l.name]));
const mr=[];ms.docs.forEach(d=>{const m=d.data();Object.entries(m.scores||{}).forEach(([id,x])=>{const l=L[id]||{};mr.push([m.exam,m.grade,m.subject,l.adm||"",l.name||"(removed learner)",x])})});mr.sort((a,b)=>String(a[0]).localeCompare(String(b[0]))||gn(a[1])-gn(b[1])||String(a[2]).localeCompare(String(b[2]))||String(a[4]).localeCompare(String(b[4])));
sh("Marks",["Exam","Grade","Subject","ADM","Name","Score"],mr);
sh("Payments",["Date","Year","Grade","ADM","Name","Amount (KES)"],[...D.pay].sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(x=>{const l=L[x.lid]||{};return [x.date,x.year||"",x.grade||l.grade||"",l.adm||"",x.name||l.name||"",x.amount]}));
sh("Fees per grade",["Grade","Yearly fee (KES)"],CL.map(g=>[g,D.fees[g]||0]));
const buf=await wb.xlsx.writeBuffer(),b=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="nccs-backup-"+td()+".xlsx";a.click();toast("Backup downloaded")}catch(e){toast(String(e.message||e).replace("Firebase: ",""))}}

let uu=()=>{};
auth.onAuthStateChanged(u=>{uu();stop();me=u;role=null;admin=false;$("so").style.display=u?"":"none";if(!u)return render();
uu=db.doc("users/"+u.uid).onSnapshot(s=>{const r=s.data()?.role||"pending";myCl=s.data()?.classes||[];myName=s.data()?.name||"";if(r!="admin"&&myCl.length&&!myCl.includes(sel.grade)&&!sel.cl0){sel.grade=myCl[0];sel.cl0=1}if(r!=role){role=r;admin=r=="admin";stop();if(role=="teacher"||admin)start()}render()},e=>console.log(e))});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
